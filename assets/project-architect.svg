<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Giant floating architectural brutalist curve -->
  <path d="M-50 480 Q250 150 550 200 T850 80" fill="none" stroke="#f8fafc" stroke-width="40" stroke-opacity="0.85"/>
  <path d="M120 500 L280 260 L460 260 L420 500 Z" fill="url(#concrete)" stroke="#f8fafc" stroke-width="1.5"/>
  <path d="M420 500 L460 260 L620 280 L560 500 Z" fill="#334155"/>

  <!-- Cantilevered glass volume -->
  <polygon points="240,240 440,220 520,310 320,330" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/>
  <line x1="290" y1="235" x2="370" y2="325" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="340" y1="230" x2="420" y2="320" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="390" y1="225" x2="470" y2="315" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Water reflection pool at bottom -->
  <rect x="0" y="420" width="800" height="80" fill="#082f49" fill-opacity="0.7"/>
  <line x1="100" y1="440" x2="700" y2="440" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="180" y1="465" x2="620" y2="465" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Tiny human scale figure on terrace -->
  <rect x="375" y="210" width="5" height="10" fill="#f43f5e"/>
  <circle cx="377.5" cy="207" r="2.5" fill="#f43f5e"/>

  <!-- Framing & Typography -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <text x="45" y="65" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#38bdf8" letter-spacing="3">AI ARCHITECTURE • LIGHTING &amp; COMPOSITION</text>
  <text x="45" y="445" font-family="'Bebas Neue', sans-serif" font-size="34" fill="#FFFFFF" letter-spacing="2">THE ARCHITECT'S DREAM</text>
  <text x="755" y="445" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#FF1E1E" text-anchor="end" font-weight="bold">PROMPT MASTERCLASS</text>
</svg>
