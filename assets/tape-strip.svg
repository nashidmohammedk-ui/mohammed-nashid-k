<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 55" fill="none">
  <defs>
    <filter id="tapeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#f5f5f5" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#e8e8e8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <!-- Tape body with rough jagged torn ends -->
  <path d="M4 12 L1 18 L4 25 L0 32 L3 38 L1 45 L156 42 L159 36 L156 30 L160 22 L157 15 L159 9 L4 12 Z" 
        fill="url(#tapeGrad)" filter="url(#tapeGlow)"/>
  <!-- Highlight creases -->
  <line x1="8" y1="14" x2="152" y2="12" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.75"/>
  <line x1="25" y1="16" x2="40" y2="40" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="110" y1="14" x2="125" y2="38" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.4"/>
</svg>
