<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="speedGlow" cx="65%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#FF1E1E" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#ff7b00" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#140202" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1E1E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF1E1E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#speedGlow)"/>

  <!-- Speed light streaks across highway -->
  <line x1="-50" y1="360" x2="850" y2="390" stroke="url(#streak)" stroke-width="4"/>
  <line x1="100" y1="375" x2="780" y2="395" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="-80" y1="410" x2="820" y2="430" stroke="#FF1E1E" stroke-width="6" stroke-opacity="0.7"/>
  <line x1="50" y1="435" x2="850" y2="450" stroke="#ff8800" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Hypercar aerodynamic profile -->
  <g transform="translate(180, 220)">
    <!-- Body curves -->
    <path d="M-20 120 C40 100 120 70 240 68 C340 68 400 95 480 120 C470 140 430 148 400 148 C300 148 200 148 -10 148 Z" fill="#080808" stroke="#FF1E1E" stroke-width="2"/>
    <!-- Cockpit glass dome -->
    <path d="M120 70 C160 30 240 28 320 68 Z" fill="#181820" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Rear aerodynamic wing -->
    <path d="M-40 85 L-10 85 L0 100 L-40 100 Z" fill="#FF1E1E"/>
    <!-- LED tail light strip -->
    <line x1="-30" y1="105" x2="40" y2="108" stroke="#FF1E1E" stroke-width="4.5"/>
    <!-- Headlight beam -->
    <polygon points="460,110 700,90 700,160 480,125" fill="#ffffff" fill-opacity="0.15"/>
    <line x1="450" y1="112" x2="480" y2="114" stroke="#ffffff" stroke-width="4"/>
    <!-- Front wheel -->
    <circle cx="390" cy="145" r="32" fill="#0a0a0a" stroke="#FF1E1E" stroke-width="3"/>
    <circle cx="390" cy="145" r="16" fill="#1e1e1e"/>
    <!-- Rear wheel -->
    <circle cx="60" cy="145" r="32" fill="#0a0a0a" stroke="#FF1E1E" stroke-width="3"/>
    <circle cx="60" cy="145" r="16" fill="#1e1e1e"/>
  </g>

  <!-- Framing & Typography -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <text x="45" y="65" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#FF1E1E" letter-spacing="3">SHORT-FORM REELS • HIGH-ENERGY PACING</text>
  <text x="45" y="445" font-family="'Bebas Neue', sans-serif" font-size="34" fill="#FFFFFF" letter-spacing="2">VELOCITY X: APEX MOTION</text>
  <text x="755" y="445" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="end" font-weight="bold">AI VIDEO + SOUND DESIGN</text>
</svg>
