<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="templeGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#B71C1C" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#1b0000" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#templeGlow)"/>

  <!-- Palm tree silhouettes -->
  <path d="M70 500 Q90 320 150 200" stroke="#060101" stroke-width="12" fill="none"/>
  <path d="M150 200 Q190 170 230 190" stroke="#060101" stroke-width="5" fill="none"/>
  <path d="M150 200 Q200 220 220 250" stroke="#060101" stroke-width="5" fill="none"/>
  <path d="M150 200 Q140 150 110 130" stroke="#060101" stroke-width="5" fill="none"/>
  <path d="M150 200 Q110 170 80 190" stroke="#060101" stroke-width="5" fill="none"/>

  <path d="M740 500 Q710 300 660 170" stroke="#060101" stroke-width="14" fill="none"/>
  <path d="M660 170 Q610 140 580 160" stroke="#060101" stroke-width="5" fill="none"/>
  <path d="M660 170 Q620 190 600 220" stroke="#060101" stroke-width="5" fill="none"/>
  <path d="M660 170 Q690 120 730 110" stroke="#060101" stroke-width="5" fill="none"/>
  <path d="M660 170 Q710 160 740 180" stroke="#060101" stroke-width="5" fill="none"/>

  <!-- Theyyam / Kathakali ornate headdress crown silhouette with vivid colors -->
  <g transform="translate(400, 270)">
    <!-- Ornate halo disc -->
    <circle cx="0" cy="-60" r="140" fill="none" stroke="#FFD700" stroke-width="4" stroke-dasharray="8 6"/>
    <circle cx="0" cy="-60" r="125" fill="#E65100" fill-opacity="0.3"/>
    
    <!-- Headdress spikes -->
    <path d="M-110 -60 Q-150 -120 0 -190 Q150 -120 110 -60 Z" fill="#D50000" stroke="#FFD700" stroke-width="3"/>
    <circle cx="0" cy="-140" r="18" fill="#FFD700"/>
    <circle cx="-50" cy="-110" r="12" fill="#FFD700"/>
    <circle cx="50" cy="-110" r="12" fill="#FFD700"/>

    <!-- Green face paint mask -->
    <ellipse cx="0" cy="0" rx="42" ry="54" fill="#00C853" stroke="#FFFFFF" stroke-width="5"/>
    <path d="M-30 -10 Q0 15 30 -10" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Intense red eyes -->
    <ellipse cx="-16" cy="-10" rx="9" ry="5" fill="#FF1744"/>
    <ellipse cx="16" cy="-10" rx="9" ry="5" fill="#FF1744"/>
    <!-- Traditional red lips -->
    <path d="M-15 24 Q0 36 15 24 Z" fill="#D50000"/>
    <!-- Chutti white ridge -->
    <path d="M-40 -20 C-45 35 0 65 0 65 C0 65 45 35 40 -20" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  </g>

  <!-- Temple lamp sparks & embers -->
  <circle cx="380" cy="410" r="3" fill="#FFF59D"/>
  <circle cx="430" cy="380" r="2.5" fill="#FFF59D"/>
  <circle cx="340" cy="340" r="2" fill="#FFCC80"/>
  <circle cx="470" cy="320" r="2" fill="#FFCC80"/>

  <!-- Framing & Typography -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
  <text x="45" y="65" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#FFD700" letter-spacing="3">CULTURAL NARRATIVE • VISUAL STORYTELLING</text>
  <text x="45" y="445" font-family="'Bebas Neue', sans-serif" font-size="34" fill="#FFFFFF" letter-spacing="2">KERALA CHRONICLES: MYTH &amp; MOTION</text>
  <text x="755" y="445" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#FF1E1E" text-anchor="end" font-weight="bold">AI MOTION SYNTHESIS</text>
</svg>
